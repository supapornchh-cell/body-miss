<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-head {
      padding: var(--space-5) 0 var(--space-4);
      background: linear-gradient(180deg, var(--cream) 0%, var(--ivory) 100%);
    }
    .page-head h1 {
      font-size: clamp(1.8rem, 4vw, 2.75rem);
      line-height: 1.4;
    }
    .page-head p {
      margin-bottom: 0;
    }
    .admin-section {
      padding: var(--space-4) 0 var(--space-6);
    }
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line-soft);
    }
    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 0.85rem 1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
      line-height: 1.6;
    }
    #ordersTable thead th {
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      border-bottom: 1px solid var(--line);
      background: var(--cream);
    }
    #ordersTable tbody td {
      color: var(--ink-soft);
    }
    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
    #ordersTable th:nth-child(5),
    #ordersTable td:nth-child(5) {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 class="title-rule">รายการสั่งซื้อ</h1>
        <p>ออเดอร์ล่าสุดอยู่ด้านบน</p>
      </div>
    </section>

    <section class="admin-section">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
